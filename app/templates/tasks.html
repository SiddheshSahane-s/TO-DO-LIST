{% extends "base.html" %}
{% block title %} TASKS {% endblock %}

{% block content %}
<div class="task-box">
    <h2>Your TASKS</h2>
    <form action="{{ url_for('tasks.add_tasks') }}" method="post" class="task-form">
        <input type="text" name="title" placeholder="New tasks" required>
        <button type="submit" class="btn">ADD</button>
    </form>

    {% if tasks %}
    <form method="post" action="{{ url_for('tasks.clear_task') }}">
        <button type="submit" class="btn btn-clear">Clear all tasks</button>

    </form><br>
    <table class="tasks_table">
        <thead>
            <tr>
                <th>#</th>
                <th>Tasks</th>
                <th>status</th>
                <th>Change</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ task.title }}</td>
                <td>
                    <span class="badge {{ task.status|lower }}" >{{task.status}}</span>
                </td>
                <td>
                    <form action="{{ url_for('tasks.toggle_status', task_id = task.id) }}" method="post">
                        <button type="submit" class="btn-small">Next</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
        
    </table>
        {% else %}
        <p>no tasks yet. add one above</p>
        {% endif %}
</div>
{% endblock %}
